name: macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        working-directory: macos
        run: ./build.sh

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Cybion -srcfolder macos/build/Cybion.app \
            -ov -format UDZO dist/cybion-app-macos-universal.dmg
          cd dist && shasum -a 256 cybion-app-macos-universal.dmg > cybion-app-macos-universal.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
