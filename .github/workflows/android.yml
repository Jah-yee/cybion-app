name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Configure signing
        if: ${{ secrets.CYBION_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBION_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "CYBION_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CYBION_ANDROID_KEYSTORE_PASSWORD=${{ secrets.CYBION_ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CYBION_ANDROID_KEY_ALIAS=${{ secrets.CYBION_ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CYBION_ANDROID_KEY_PASSWORD=${{ secrets.CYBION_ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage artifacts
        working-directory: android
        run: |
          mkdir -p ../dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$APK" ../dist/cybion-app-android-universal.apk
          (cd ../dist && shasum -a 256 cybion-app-android-universal.apk > cybion-app-android-universal.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
